<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" [innerHTML]="logoMark"></span>
      <span class="brand-text">Gestion Magasin</span>
    </div>
    <nav>
      @for (group of navGroups(); track $index) {
        <div class="nav-group">
          @if (group.label) {
            <button type="button" class="nav-group-label" (click)="toggleGroup(group.label)">
              {{ group.label }}
              <span class="chevron" [class.open]="isExpanded(group.label)" [innerHTML]="chevron"></span>
            </button>
          }
          @if (isExpanded(group.label)) {
            <div class="nav-group-items">
              @for (item of group.items; track item.path) {
                <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '/' }">
                  <span class="nav-icon" [innerHTML]="icon(item.icon)"></span>
                  {{ item.label }}
                </a>
              }
            </div>
          }
        </div>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="user-info">
        @if (user(); as u) {
          <span class="avatar">{{ initials(u.email) }}</span>
          <span class="details">
            <span class="email">{{ u.email }}</span>
            <span class="badge" [class]="roleBadgeClass(u.role)">{{ u.role }}</span>
          </span>
        }
      </div>
      <button type="button" (click)="logout()">Déconnexion</button>
    </header>

    <main class="content">
      <router-outlet />
    </main>

    <footer class="app-footer">
      <small>Gestion Magasin — tous droits réservés</small>
    </footer>
  </div>
</div>
