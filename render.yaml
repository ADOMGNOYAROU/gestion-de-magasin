services:
  # Angular SPA — servi en site statique par Render.
  - type: web
    name: gestion-frontend
    runtime: static
    rootDir: apps/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: NODE_VERSION
        value: 24
    routes:
      # Angular gère le routing côté client : toute route inconnue doit retomber sur index.html.
      - type: rewrite
        source: /*
        destination: /index.html

  # API Next.js (Route Handlers uniquement, pas de pages SSR côté data).
  - type: web
    name: gestion-backend
    runtime: node
    rootDir: apps/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: PAYGATEGLOBAL_API_KEY
        sync: false
